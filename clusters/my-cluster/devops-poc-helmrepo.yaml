apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: devops-poc
  namespace: default
spec:
  interval: 5m0s
  url: https://renatovassao.github.io/devops-poc
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devops-poc
  namespace: default
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: devops-poc
      version: '0.1.*'
      sourceRef:
        kind: HelmRepository
        name: devops-poc
      interval: 5m
